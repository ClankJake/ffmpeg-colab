name: Build FFmpeg release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do FFmpeg (ex.: 9.0.2)"
        required: true
        default: "9.0.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # glibc compatível com o Colab (Ubuntu 22.04)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm yasm pkg-config autoconf automake \
            libtool libtool-bin gperf gettext autopoint texinfo help2man cmake meson ninja-build git curl xz-utils python3-pip \
            libgl1-mesa-dev libglu1-mesa-dev libfontconfig1-dev

      - name: Obter o builder e trocar a versão do FFmpeg
        run: |
          git clone --depth 1 https://github.com/XniceCraft/ffmpeg-builder builder
          cd builder
          V="${{ inputs.version }}"
          sed -i -E "s#ffmpeg-[0-9]+(\.[0-9]+)+\.tar\.xz#ffmpeg-${V}.tar.xz#g; s#\"folder_name\": \"ffmpeg-[0-9.]+\"#\"folder_name\": \"ffmpeg-${V}\"#" libraries.json
          grep -n "ffmpeg-${V}" libraries.json
          # Colab: Tesla T4, driver 580.82.07 (CUDA 13.0) -> nv-codec-headers 13.0.x (exige driver >= 570).
          # Usa o tarball da tag (sempre existe), em vez do asset de release.
          python3 - <<'PY'
          import json
          d = json.load(open("libraries.json"))
          d["ffnvcodec"]["download_params"] = [
              "https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/n13.0.19.1.tar.gz",
              "nv-codec-headers-n13.0.19.1.tar.gz",
          ]
          d["ffnvcodec"]["folder_name"] = "nv-codec-headers-n13.0.19.1"
          # HarfBuzz: o port CMake está deprecado -> Meson (módulo em patches/harfbuzz.py)
          d["harfbuzz"]["configuration"] = "meson"
          d["harfbuzz"]["configure_params"] = ["--default-library=static", "--auto-features=disabled"]
          # gmplib.org fica fora do ar/inacessível no runner: usa o espelho do GNU (mesmo tarball 6.3.0)
          d["gmp"]["download_params"] = [
              "https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz",
              "gmp-6.3.0.tar.xz",
          ]
          json.dump(d, open("libraries.json", "w"), indent=4)
          PY
          grep -n "n13.0.19.1" libraries.json
          cp ../patches/harfbuzz.py libraries/harfbuzz.py
          # libbluray: renomeia dec_init (conflita com fftools/ffmpeg_dec.c do FFmpeg >= 8) e mostra erros do autoreconf
          cp ../patches/libbluray.py libraries/libbluray.py
          # Atualiza as bibliotecas externas para a versão estável mais nova (valida cada download).
          python3 ../scripts/update_libs.py libraries.json ../lib-versions.md
          cat ../lib-versions.md >> "$GITHUB_STEP_SUMMARY"
          # OpenSSL 3 instala em lib64 por padrão; o builder espera lib/
          sed -i 's#"no-shared",#"no-shared",\n        "--libdir=lib",#' libraries/openssl.py
          grep -n -- '--libdir=lib' libraries/openssl.py
          # Torna o download robusto: --fail evita salvar página de erro como se fosse o .tar,
          # --retry tenta de novo, e o tar deixa de ser silencioso para mostrar o erro real.
          sed -i 's#"--insecure", "-L", "--silent", "-o"#"--insecure", "-fL", "--retry", "3", "--retry-delay", "5", "--silent", "--show-error", "--connect-timeout", "20", "-o"#' build.py
          sed -i '396s#silent=True#silent=False#' build.py
          grep -n '"--retry"' build.py
          pip install -r requirements.txt

      - name: Compilar
        working-directory: builder
        env:
          CFLAGS: "-mtune=generic"
        run: |
          sudo mkdir -p /home/ffmpeg-builder && sudo chown "$USER" /home/ffmpeg-builder
          python build.py --use-system-build-tools --use-nonfree-libs --static-ffmpeg \
            --exclude-targets "ffmpeg-msys2-deps" --disable-ffplay \
            --extra-ffmpeg-args="--enable-nvenc --enable-nvdec --enable-cuvid --toolchain=hardened --disable-stripping --enable-opengl " \
            --build

      - name: Localizar o binário
        run: |
          BIN="$(find / -type f -path '*release/bin/ffmpeg' 2>/dev/null | head -n1)"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" -version | head -n 1
          "$BIN" -hide_banner -encoders | grep -E "nvenc" || { echo "NVENC ausente"; exit 1; }

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" "$BIN" \
            --title "FFmpeg ${{ inputs.version }}" \
            --notes-file lib-versions.md \
            || gh release upload "${{ inputs.version }}" "$BIN" --clobber
